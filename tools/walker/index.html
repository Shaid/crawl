<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dungeon Walker</title>
  <link rel="stylesheet" href="walker.css" />
</head>
<body>
  <div id="app">
    <header id="toolbar">
      <span id="title">Dungeon Walker</span>
      <select id="game" title="Game"></select>
      <select id="level" title="Level / map"></select>
      <select id="variant" title="Graphics variant (W6)" style="display:none"></select>
      <label class="toggle"><input type="checkbox" id="noclip" /> noclip</label>
      <span id="status">loading…</span>
      <span id="confidence"></span>
      <span id="help">WASD/arrows move · Q/E turn · Space interact (BC) · Tab automap zoom</span>
      <a id="viewer-link" class="nav-link" href="/tools/viewer/index.html">Asset Viewer →</a>
    </header>
    <div id="body">
      <div id="canvas-wrap">
        <canvas id="surface" width="320" height="200"></canvas>
      </div>
      <aside id="sidebar">
        <section class="panel">
          <h2>Minimap</h2>
          <canvas id="minimap"></canvas>
        </section>
        <section class="panel">
          <h2>Automap</h2>
          <canvas id="automap"></canvas>
        </section>
      </aside>
    </div>
  </div>
  <script type="module" src="walker.ts"></script>
</body>
</html>
